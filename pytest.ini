[pytest]
testpaths = tests
pythonpath = .

addopts =
    --browser chromium
    --browser-channel chrome
    --tracing retain-on-failure
    --screenshot only-on-failure
    --html=report.html
    --self-contained-html

# Browser + channel mirror the JS "chrome" project.
# NOTE: video is disabled here because Playwright's bundled ffmpeg is not
# available on macOS 12. On macOS 13+ / CI run `playwright install ffmpeg`
# and add `--video retain-on-failure` to addopts to match the JS config.

markers =
    smoke: marks tests as part of the smoke suite
